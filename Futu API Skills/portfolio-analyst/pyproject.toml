[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moomoo-portfolio-analyst"
version = "0.4.0"
description = "Read-only portfolio analysis commands backed by the official Futu API Skill"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.data-files]
schemas = ["schemas/portfolio_snapshot.schema.json", "schemas/report_defs.schema.json", "schemas/risk_report.schema.json", "schemas/portfolio_report.schema.json", "schemas/trade_review.schema.json", "schemas/rebalance_request.schema.json", "schemas/rebalance_result.schema.json", "schemas/position_lifecycle.schema.json", "schemas/lifecycle_record.schema.json", "schemas/journal_event.schema.json"]
