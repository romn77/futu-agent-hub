[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moomoo-portfolio-analyst"
version = "0.9.0"
description = "Read-only portfolio analysis commands backed by the official Futu API Skill"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
portfolio-analyst = "portfolio_analyst.cli:main"
portfolio-cache = "portfolio_analyst.cache.cli:main"
portfolio-cached-analysis = "portfolio_analyst.cache.workflow_cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = ["portfolio_analyst", "portfolio_analyst.cache"]

[tool.setuptools.data-files]
schemas = ["schemas/portfolio_snapshot.schema.json", "schemas/report_defs.schema.json", "schemas/risk_report.schema.json", "schemas/technical_report.schema.json", "schemas/option_risk.schema.json", "schemas/portfolio_report.schema.json", "schemas/trade_review.schema.json", "schemas/rebalance_request.schema.json", "schemas/rebalance_result.schema.json", "schemas/position_lifecycle.schema.json", "schemas/lifecycle_record.schema.json", "schemas/journal_event.schema.json", "schemas/performance_attribution.schema.json", "schemas/cache_request.schema.json", "schemas/cached_analysis_request.schema.json"]
"share/moomoo-portfolio-analyst" = ["SKILL.md"]
"share/moomoo-portfolio-analyst/references" = ["references/*.md"]
"share/moomoo-portfolio-analyst/references/tool-contract/core" = ["references/tool-contract/core/*.md"]
"share/moomoo-portfolio-analyst/references/tool-contract/optional" = ["references/tool-contract/optional/*.md"]
"share/moomoo-portfolio-analyst/references/optional-workflows" = ["references/optional-workflows/*.md"]
"share/moomoo-portfolio-analyst/references/implementation" = ["references/implementation/*.md"]
