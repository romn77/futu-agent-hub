[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moomoo-portfolio-analyst"
version = "0.1.0"
description = "Read-only portfolio analysis commands backed by the official Futu API Skill"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
